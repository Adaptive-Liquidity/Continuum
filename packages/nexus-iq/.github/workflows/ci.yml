name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  lint:
    name: Shell, mode, and compose contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: shellcheck all kit scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck -S error -e SC1091 \
            install.sh start.sh stop.sh restart.sh reset.sh uninstall.sh \
            doctor.sh logs.sh connect-mcp.sh generate-mcp-config.sh \
            run-live-example.sh verify-live-stack.sh scripts/*.sh tests/*.sh

      - name: bash syntax
        run: |
          for file in *.sh scripts/*.sh tests/*.sh; do
            bash -n "$file"
          done

      - name: release-tag safety contracts
        run: ./tests/release-tag.sh

      - name: runtime-mode and validator contracts
        run: ./tests/keyless-mode.sh

      - name: installer decision contracts
        run: ./tests/install-decisions.sh

      - name: compose profile contracts
        run: |
          ./tests/compose-profiles.sh
          cp .env.example .env
          ./scripts/generate-secrets.sh
          docker compose config --quiet
          docker compose --profile tools config --quiet
          docker compose --profile memory --profile tools config --quiet
          echo "default, tools, and memory+tools compose models OK"

  smoke:
    # Full from-source Nexus build. Manual/nightly because compiling the pinned
    # product source is intentionally too expensive for every PR.
    name: Keyless source install smoke (manual/nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install (fresh keyless source flow)
        run: |
          test ! -e .env
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u GEMINI_API_KEY \
            ./install.sh
          grep -qx 'NEXUS_AEON_ENABLED=false' .env
          if grep -Eq '^(OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY)=.+' .env; then
            echo "::error::install wrote a provider credential"
            exit 1
          fi
          test ! -e vendor/aeon-iq
          test -e vendor/nexus
          test -s data/modules/sample_tool.wasm

      - name: start (Nexus-only service set)
        run: |
          ./start.sh
          running="$(docker compose --profile memory ps --status running --services)"
          grep -qx 'nexus-agentd' <<<"$running"
          if grep -Eq '^(postgres|aeon|aeon-worker)$' <<<"$running"; then
            echo "::error::memory service running in keyless mode"
            exit 1
          fi

      - name: doctor (memory disabled is healthy)
        run: |
          ./doctor.sh | tee doctor.out
          grep -Fq 'memory plane disabled by configuration' doctor.out
          ! grep -Eiq '(memory recall|memory write).*(PASS|passed)' doctor.out

      - name: smoke — Nexus MCP execution surface
        run: ./scripts/smoke-nexus-execute.sh

      - name: smoke — WASM execution and Proof Capsule
        run: |
          before="$(find data/proofs -type f | wc -l)"
          ./scripts/smoke-proof-capsule.sh
          after="$(find data/proofs -type f | wc -l)"
          test "$after" -gt "$before"

      - name: verify selected live stack
        run: |
          ./verify-live-stack.sh | tee verify.out
          grep -Fq 'Nexus execution/proof plane verified; memory intentionally disabled.' verify.out
          ! grep -Eiq '(memory recall|memory write).*(PASS|passed)' verify.out

      - name: optional full-memory and transition coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning title=Full-memory coverage not run::No real OPENAI_API_KEY secret is configured. Keyless coverage passed; memory coverage is not reported as successful."
            exit 0
          fi

          KEY=OPENAI_API_KEY VALUE="$OPENAI_API_KEY" awk '
            BEGIN { key = ENVIRON["KEY"]; value = ENVIRON["VALUE"] }
            $0 ~ "^" key "=" { print key "=" value; found = 1; next }
            { print }
            END { if (!found) print key "=" value }
          ' .env >.env.next
          mv .env.next .env
          sed -i 's/^NEXUS_AEON_ENABLED=.*/NEXUS_AEON_ENABLED=true/' .env

          ./install.sh
          ./start.sh
          ./doctor.sh
          ./verify-live-stack.sh

          postgres_id="$(docker compose --profile memory ps -q postgres)"
          volume_name="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres_id")"
          test -n "$volume_name"

          # enabled -> disabled: stop memory services, preserve the data volume,
          # and keep the Nexus execution plane healthy.
          sed -i 's/^NEXUS_AEON_ENABLED=.*/NEXUS_AEON_ENABLED=false/' .env
          ./start.sh
          test -z "$(docker compose --profile memory ps --status running -q postgres aeon aeon-worker)"
          docker volume inspect "$volume_name" >/dev/null
          ./scripts/smoke-nexus-execute.sh
          ./scripts/smoke-proof-capsule.sh

          # disabled -> enabled: the same configured memory volume returns.
          sed -i 's/^NEXUS_AEON_ENABLED=.*/NEXUS_AEON_ENABLED=true/' .env
          ./start.sh
          new_postgres_id="$(docker compose --profile memory ps -q postgres)"
          new_volume_name="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$new_postgres_id")"
          test "$new_volume_name" = "$volume_name"
          ./verify-live-stack.sh

      - name: stack logs on failure
        if: failure()
        run: docker compose --profile memory --profile tools logs --tail=200 --no-color

      - name: stop stack
        if: always()
        run: ./stop.sh || true
