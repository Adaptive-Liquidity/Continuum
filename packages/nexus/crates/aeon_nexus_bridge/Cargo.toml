[package]
name = "aeon_nexus_bridge"
version = "0.1.0"
edition = "2021"
description = "Shared AEON-IQ/Nexus memory evidence wire types and digest helpers"
license = "MIT"
publish = false

[features]
preserve-order-conformance = ["serde_json/preserve_order"]

[dependencies]
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# RecallEnvelopeV2 types `request_id` and `run_id` as UUIDs rather than opaque
# strings, so a malformed identifier fails at parse time instead of reaching the
# signer. `serde` only -- no `v4` generator, because this crate never mints
# identifiers; producers supply them.
uuid = { version = "1", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
# Test-only. Used exclusively to produce and check the deterministic Ed25519
# vector under `vectors/`. This crate performs no runtime signing or
# verification -- that is S0.1b (AEON signer) and S0.1c (Nexus verifier).
ed25519-dalek = "2"
# Test-only JSON Schema validator (draft 2020-12), used to prove the
# language-neutral schema and the Rust types agree. Pure Rust, no network
# fetching of remote `$ref`s. Deliberately NOT a runtime dependency: the crate
# validates via `validate()`, never by loading a schema at run time.
boon = "0.6"
