name: One-time canonical terminology cleanup

on:
  push:
    branches:
      - proof/continuum-persistence-slice-2a

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore(canon): apply generated terminology cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/continuum-persistence-slice-2a
      - name: Apply canonical terminology replacements
        shell: python
        run: |
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      print(f"WARN missing in {path}: {old!r}")
                  s = s.replace(old, new)
              p.write_text(s)

          replace("backend/server.py", [
              ("\"\"\"floks-pc DCA Orchestrator — FastAPI server.\n\nIntegrates the seven mandatory DCA responsibilities across:\n  R1 Principal Identity      -> /api/dca/veras                (VERA registry)\n  R2 Environment/Runtime     -> /api/dca/placements           (floks-pc lineage)\n  R3 Durable State/Memory    -> /api/dca/memory               (aeon-iq lineage)\n  R4 Authority/Capability    -> /api/dca/authority            (genesis lineage)\n  R5 Effectful Execution     -> /api/dca/effects              (nexus lineage)\n  R6 Evidence/Verification   -> /api/dca/evidence             (context-kernel lineage)\n  R7 Coordination/Interconnect -> /api/dca/sessions           (agent-bridge lineage)\n\nEffect Boundary (cross-cutting) is enforced inside /effects/dispatch — the\ngateway resolves authority (R4), checks placement (R2), executes via nexus\nadapter (R5), and appends evidence (R6) atomically per action_id.\n\"\"\"",
               "\"\"\"Continuum DCA Orchestrator — FastAPI server.\n\nCanonical DCA responsibilities:\n  R1 Environment        -> /api/dca/placements  (floks-pc lineage)\n  R2 State              -> /api/dca/memory      (aeon-iq lineage)\n  R3 Authority          -> /api/dca/authority   (genesis lineage)\n  R4 Execution          -> /api/dca/effects     (nexus lineage)\n  R5 Evidence           -> /api/dca/evidence    (evidence lineage)\n  R6 Coordination       -> /api/dca/sessions    (agent-bridge lineage)\n  R7 Cognition Boundary -> model-neutral interface boundary\n\nVERA is the persistent principal and is cross-cutting rather than a numbered\nresponsibility. The Effect Boundary resolves authority, checks environment,\nexecutes through Nexus, and records evidence atomically per action_id.\n\"\"\""),
              ('app = FastAPI(title="floks-pc DCA Orchestrator", version="0.1.0")', 'app = FastAPI(title="Continuum DCA Orchestrator", version="0.1.0")'),
              ('"product": "floks-pc DCA"', '"product": "Continuum"'),
              ('"hierarchy": ["Asentxia Systems", "DCA", "Continuum (floks-pc lineage)", "VERA", "The Regency"]', '"hierarchy": ["Asentxia Systems", "DCA", "Continuum", "VERA", "The Regency"]'),
              ('"1: Principal Identity & Responsibility",\n            "2: Environment & Runtime Continuity",\n            "3: Durable State & Memory",\n            "4: Authority & Capability Governance",\n            "5: Effectful Execution",\n            "6: Evidence, Verification & Recovery",\n            "7: Coordination & Interconnect",', '"1: Environment",\n            "2: State",\n            "3: Authority",\n            "4: Execution",\n            "5: Evidence",\n            "6: Coordination",\n            "7: Cognition Boundary",'),
              ('"floks-pc": {"role": "R2",', '"floks-pc": {"role": "Environment",'),
              ('"aeon-iq": {"role": "R3",', '"aeon-iq": {"role": "State",'),
              ('"nexus": {"role": "R5",', '"nexus": {"role": "Execution",'),
              ('"nexus-iq": {"role": "R5+R6",', '"nexus-iq": {"role": "Execution+Evidence",'),
              ('"genesis": {"role": "R1+R4",', '"genesis": {"role": "Authority+VERA",'),
              ('"context-kernel": {"role": "R6",', '"context-kernel": {"role": "Evidence research",'),
              ('# R1 — Principal Identity & Responsibility (VERA registry)', '# Persistent principal — VERA registry (cross-cutting)'),
              ('# R2 — Environment & Runtime Continuity (floks-pc Agent Computer)', '# R1 — Environment (Continuum Computer; floks-pc lineage)'),
              ('# R3 — Durable State & Memory (aeon-iq lineage)', '# R2 — State (aeon-iq lineage)'),
              ('# R4 — Authority & Capability Governance (genesis lineage)', '# R3 — Authority (genesis lineage)'),
              ('# R5 — Effectful Execution (nexus lineage) + Effect Boundary', '# R4 — Execution (nexus lineage) + Effect Boundary'),
              ('# R6 — Evidence, Verification & Recovery (context-kernel lineage)', '# R5 — Evidence'),
              ('# R7 — Coordination & Interconnect (sessions + handoffs)', '# R6 — Coordination (sessions + handoffs)'),
              ('\"\"\"R7 — authenticated handoff between VERAs. Preserves participant separation.\"\"\"', '\"\"\"R6 Coordination — authenticated handoff preserving participant separation.\"\"\"'),
              ('# Phase 2 — Regency Console (governance) — bound to R4', '# Phase 2 — Regency Console (governance) — bound to Authority'),
              ('mandate="Demonstrate the seven DCA responsibilities end-to-end."', 'mandate="Demonstrate the bounded Continuum reference surfaces end-to-end."'),
          ])

          replace("frontend/src/App.js", [
              ('const RESPONSIBILITIES = [\n  { n: "R1", path: "/veras", label: "Principal Identity", lineage: "vera registry" },\n  { n: "R2", path: "/placements", label: "Environment & Runtime", lineage: "floks-pc" },\n  { n: "R3", path: "/memory", label: "Durable State & Memory", lineage: "aeon-iq" },\n  { n: "R4", path: "/authority", label: "Authority & Capability", lineage: "genesis" },\n  { n: "R5", path: "/effects", label: "Effectful Execution", lineage: "nexus" },\n  { n: "R6", path: "/evidence", label: "Evidence & Verification", lineage: "context-kernel" },\n  { n: "R7", path: "/sessions", label: "Coordination & Interconnect", lineage: "agent-bridge" },\n];', 'const RESPONSIBILITIES = [\n  { n: "R1", path: "/placements", label: "Environment", lineage: "floks-pc" },\n  { n: "R2", path: "/memory", label: "State", lineage: "aeon-iq" },\n  { n: "R3", path: "/authority", label: "Authority", lineage: "genesis" },\n  { n: "R4", path: "/effects", label: "Execution", lineage: "nexus" },\n  { n: "R5", path: "/evidence", label: "Evidence", lineage: "context-kernel" },\n  { n: "R6", path: "/sessions", label: "Coordination", lineage: "agent-bridge" },\n  { n: "R7", path: "/veras", label: "Cognition Boundary", lineage: "model-neutral interface" },\n];'),
              ('<div className="brand">floks-pc // DCA</div>', '<div className="brand">Continuum // DCA</div>'),
              ('title="Overview /::/ floks-pc"', 'title="Overview /::/ Continuum"'),
              ('sub="Continuum lineage · six-package DCA reference"', 'sub="Flagship DCA implementation · canonical reference surfaces"'),
              ('["veras", "R1 · VERA principals"],\n          ["placements", "R2 · Runtime placements"],\n          ["memories", "R3 · Memory facts"],\n          ["grants", "R4 · Authority grants"],\n          ["effects", "R5 · Effects"],\n          ["evidence", "R6 · Evidence entries"],\n          ["sessions", "R7 · Sessions"],', '["veras", "VERA · Persistent principals"],\n          ["placements", "R1 · Environment"],\n          ["memories", "R2 · State"],\n          ["grants", "R3 · Authority"],\n          ["effects", "R4 · Execution"],\n          ["evidence", "R5 · Evidence"],\n          ["sessions", "R6 · Coordination"],'),
              ('<div className="card-title">R6 · Chain verify</div>', '<div className="card-title">R5 · Evidence chain</div>'),
              ('authority (R4) decides; nexus (R5) contains;\n        evidence (R6) records.', 'authority (R3) decides; nexus (R4) contains;\n        evidence (R5) records.'),
              ('governance product bound to R4.', 'governance product bound to Authority.'),
              ('title="R1 /::/ Principal Identity"', 'title="R7 /::/ Cognition Boundary"'),
              ('title="R2 /::/ Environment & Runtime"', 'title="R1 /::/ Environment"'),
              ('title="R3 /::/ Durable State & Memory"', 'title="R2 /::/ State"'),
              ('title="R4 /::/ Authority & Capability Governance"', 'title="R3 /::/ Authority"'),
              ('title="R5 /::/ Effectful Execution"', 'title="R4 /::/ Execution"'),
              ('title="R6 /::/ Evidence, Verification & Recovery"', 'title="R5 /::/ Evidence"'),
              ('title="R7 /::/ Coordination & Interconnect"', 'title="R6 /::/ Coordination"'),
              ('Role assignments · materialize as R4 grants', 'Role assignments · materialize as Authority grants'),
              ('role: "R2 · Environment & Runtime Continuity"', 'role: "Environment"'),
              ('role: "R3 · Durable State & Memory"', 'role: "State"'),
              ('role: "R5 · Effectful Execution"', 'role: "Execution"'),
              ('role: "R5+R6 · Self-host + proof capsules"', 'role: "Execution + Evidence"'),
              ('role: "R1+R4 · Identity + Authority"', 'role: "Authority + VERA mechanisms"'),
              ('role: "R6 · Context provenance + Evidence"', 'role: "Evidence research / context admission"'),
          ])

          Path('.github/workflows/one-time-canonical-cleanup.yml').unlink()
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/src/App.js .github/workflows/one-time-canonical-cleanup.yml
          git diff --cached --check
          git commit -m "chore(canon): apply generated terminology cleanup"
          git push
